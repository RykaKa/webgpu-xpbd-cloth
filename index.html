<!DOCTYPE html>
<!--
    Этот файл:
      1. Создаёт <canvas> для рисования через WebGPU.
      2. Создаёт UI (чекбокс гравитации, счётчик FPS).
      3. Подключает cloth.js как ES-модуль, где вся логика симуляции.
-->
<!-- lang="ru" — сообщаем браузеру, что контент на русском -->
<html lang="ru">

<head>
    <!-- Кодировка файла: UTF-8 для корректного отображения русских букв-->
    <meta charset="UTF-8">

    <!--
        viewport — для корректного масштабирования на мобильных устройствах.
        width=device-width — ширина страницы равна ширине экрана устройства.
        initial-scale=1.0 — начальный зум 100%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Заголовок вкладки браузера -->
    <title>XPBD Cloth Simulation — WebGPU</title>

    <style>
        /* ============================================================
           СБРОС СТИЛЕЙ
           Убираем отступы по умолчанию у всех элементов и включаем
           border-box, чтобы padding не увеличивал размеры элементов.
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           ОФОРМЛЕНИЕ BODY
           Тёмный фон, центрирование содержимого по обеим осям.
           ============================================================ */
        body {
            background: #1a1a2e; /* тёмно-синий фон */
            display: flex; /* flex-контейнер */
            flex-direction: column; /* элементы друг под другом */
            align-items: center; /* центр по горизонтали */
            justify-content: center; /* центр по вертикали */
            min-height: 100vh; /* минимум на всю высоту окна */
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0; /* светло-серый текст */
            overflow: hidden; /* убираем скроллбар */
        }

        /* ============================================================
           CANVAS — полотно для WebGPU
           В него мы будем рисовать сцену с тканью
           (размеры 1024x768 задаются атрибутами width/height в HTML).
           ============================================================ */
        canvas {
            border-radius: 8px; /* скруглённые углы */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); /* тень под полотном */
            max-width: 95vw; /* не шире 95% окна */
            max-height: 80vh; /* не выше 80% окна */
            background: #000; /* чёрный фон, пока не отрисовано */
        }

        /* ============================================================
           ПАНЕЛЬ КОНТРОЛОВ ПОД CANVAS
           Содержит чекбокс «Включить гравитацию» и счётчик FPS.
           ============================================================ */
        .controls {
            margin-top: 16px; /* отступ сверху от canvas */
            display: flex; /* в ряд */
            gap: 24px; /* расстояние между элементами */
            align-items: center; /* выровнять по центру */
            padding: 12px 24px; /* внутренние отступы */
            background: #16213e; /* тёмно-синий фон панели */
            border-radius: 8px; /* скругление */
            border: 1px solid #0f3460; /* тонкая синяя рамка */
        }

            /* Стилизация label — обёртки чекбокса с подписью */
            .controls label {
                display: flex;
                align-items: center;
                gap: 8px; /* отступ между чекбоксом и текстом */
                cursor: pointer; /* курсор-рука */
                font-size: 14px;
                user-select: none; /* нельзя выделить текст мышкой */
            }

            /* Стилизация самого чекбокса */
            .controls input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #e94560; /* красный цвет галочки */
                cursor: pointer;
            }

        /* Счётчик FPS — маленький серый текст справа */
        .stats {
            font-size: 12px;
            color: #888;
            margin-left: 12px;
            font-variant-numeric: tabular-nums; /* моноширинные цифры, чтобы не «дёргалось» */
        }

        /* ============================================================
           БЛОК ОШИБОК
           Показывается, если WebGPU не поддерживается.
           Меняет содержимое body из JS.
           ============================================================ */
        #error {
            padding: 40px;
            text-align: center;
            color: #e94560;
            max-width: 600px;
            line-height: 1.6;
        }

            #error h2 {
                margin-bottom: 16px;
            }

            #error p {
                color: #aaa;
                font-size: 14px;
                margin-top: 8px;
            }
    </style>
</head>

<body>
    <!--
        CANVAS — полотно, на котором WebGPU рисует кадры.
        Атрибуты width/height задают внутреннее разрешение буфера
        (не путать с CSS-размерами, которые могут масштабировать).
    -->
    <canvas id="gpuCanvas" width="1024" height="768"></canvas>

    <!--
        ПАНЕЛЬ УПРАВЛЕНИЯ
        - Чекбокс id="gravityToggle": включает/отключает гравитацию.
          По умолчанию отмечен (checked) — гравитация включена.
        - span id="stats": сюда JS будет писать текущий FPS.
    -->
    <div class="controls">
        <label>
            <input type="checkbox" id="gravityToggle" checked>
            Включить гравитацию
        </label>
        <span class="stats" id="stats">— FPS</span>
    </div>

    <!--
        ПОДКЛЮЧЕНИЕ СКРИПТА
        type="module" — ES-модуль, позволяет import/export.
        src="./cloth.js" — файл лежит рядом с index.html!
        Скрипт выполняется после разбора HTML (это не <script defer>,
        но модули и так по умолчанию отложены до окончания парсинга).
    -->
    <script type="module" src="./cloth.js"></script>
</body>

</html>
